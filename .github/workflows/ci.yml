name: service-lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/benchmark.py --port 8788 --output results/ci-offline.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-experiment-${{ matrix.python-version }}
          path: results/ci-offline.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 120
      - run: curl --fail http://127.0.0.1:8788/readyz
      - run: docker compose down
        if: always()
