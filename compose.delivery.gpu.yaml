services:
  bento:
    environment:
      MODE: vllm
      API_KEY: ${API_KEY:?Set a gateway key}
      UPSTREAM_KEY: ${UPSTREAM_KEY:?Set a separate upstream key}
      UPSTREAM_URL: http://vllm:8000
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}
      REQUEST_TIMEOUT: "60"
      CONCURRENCY: "1"
      MAX_QUEUE: "2"
    depends_on:
      vllm: {condition: service_healthy}
  vllm:
    extends:
      file: compose.gpu.yaml
      service: vllm
    # float16 also works on Turing (compute 7.5), which lacks native bfloat16.
    command:
      - --model
      - ${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}
      - --served-model-name
      - ${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}
      - --dtype
      - half
      - --max-model-len
      - "1024"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.75"
volumes:
  model-cache:
