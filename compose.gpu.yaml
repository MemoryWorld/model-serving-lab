# Official v0.30.0 tag/digest verified 2026-09-23; GPU execution still untested.
services:
  gateway:
    build: .
    ports: ["127.0.0.1:8788:8788"]
    environment:
      MODE: vllm
      API_KEY: ${API_KEY:?Set a gateway API key}
      UPSTREAM_KEY: ${UPSTREAM_KEY:?Set a separate upstream key}
      UPSTREAM_URL: http://vllm:8000
      UPSTREAM_MODEL: ${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}
      CONCURRENCY: "4"
      MAX_QUEUE: "8"
      REQUEST_TIMEOUT: "60"
      ENABLE_FAULTS: "false"
    depends_on:
      vllm:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command: ["uvicorn", "serving_lab.app:app", "--host", "0.0.0.0", "--port", "8788", "--workers", "1", "--no-access-log", "--timeout-graceful-shutdown", "65"]
    stop_grace_period: 70s
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90}
    gpus: all
    ipc: host
    environment:
      VLLM_API_KEY: ${UPSTREAM_KEY:?Set a separate upstream key}
      HF_HUB_DISABLE_TELEMETRY: "1"
    command: ["--model", "${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}", "--served-model-name", "${UPSTREAM_MODEL:-Qwen/Qwen3-0.6B}", "--max-model-len", "4096", "--max-num-seqs", "16", "--gpu-memory-utilization", "0.8"]
    volumes: ["model-cache:/root/.cache/huggingface"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      start_period: 120s
      interval: 10s
      timeout: 3s
      retries: 30
volumes:
  model-cache:
