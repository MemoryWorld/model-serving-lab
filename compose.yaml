services:
  gateway:
    build: .
    ports: ["127.0.0.1:8788:8788"]
    environment:
      MODE: offline
      CONCURRENCY: "2"
      MAX_QUEUE: "4"
      REQUEST_TIMEOUT: "5"
      ENABLE_FAULTS: "false"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 12s
